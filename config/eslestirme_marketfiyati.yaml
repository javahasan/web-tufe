# marketfiyati.org.tr ürünlerini TÜİK maddelerine eşleme kuralları
#
# Her kural:
#   madde:    TÜİK 7'li madde kodu (data/referans/sepet_<yıl>.csv)
#   sorgu:    toplama sırasında marketfiyati'de aranacak kelimeler
#   kategori: marketfiyati ana kategorisi (ürünün main_category alanı); boşsa her kategori
#   dahil:    ürün adında geçmesi gereken düzenli ifade (liste verilirse hepsi geçmeli)
#   haric:    ürün adında geçmemesi gereken düzenli ifade
#
# Ürün adı ve ifadeler karşılaştırmadan önce küçük harfe çevrilir ve Türkçe
# karakterler katlanır (ç->c, ğ->g, ı->i, ö->o, ş->s, ü->u). Kurallar YUKARIDAN
# AŞAĞI denenir, ilk uyan kural kazanır; özel kurallar genel kurallardan önce gelir.

