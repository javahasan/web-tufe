name: Günlük fiyat toplama

on:
  schedule:
    # Her gün 09:17 İstanbul (06:17 UTC). GitHub zamanlanmış işleri yoğun saatlerde
    # birkaç dakikadan bir saate kadar geciktirebilir.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "tam = toplama + hesap + kayıt; erisim_testi = kaynaklara birkaç istek atar, kayıt yapmaz"
        type: choice
        options: [tam, erisim_testi]
        default: tam

permissions:
  contents: write

concurrency:
  group: gunluk
  cancel-in-progress: false

env:
  TZ: Europe/Istanbul
  PYTHONUNBUFFERED: "1"

jobs:
  gunluk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Kurulum
        run: pip install -e ".[dev]"

      - name: Testler
        run: python -m pytest -q

      - name: Erişim testi
        if: inputs.mod == 'erisim_testi'
        run: |
          webtufe topla --konum istanbul_anadolu --sorgu-siniri 2 --tarih 1900-01-01
          python - <<'EOF'
          import glob
          import pandas as pd
          d = pd.read_parquet(glob.glob("data/ham/marketfiyati/tarih=1900-01-01/*.parquet")[0])
          print(f"{len(d)} satır, {d['zincir'].nunique()} zincir: {sorted(d['zincir'].unique())}")
          EOF
          rm -rf data/ham/marketfiyati/tarih=1900-01-01
          webtufe akaryakit --il 6 341 --sekiz-firma-azami-gun 2
          python - <<'EOF'
          import glob
          import pandas as pd
          for y in sorted(glob.glob("data/ham/epdk/*_il/tarih=*/iller.parquet")):
              d = pd.read_parquet(y)
              print(f"{y}: {len(d)} satır, {d['il_kodu'].nunique()} il, {d['firma'].nunique()} firma")
          print(open("data/ham/epdk/sekiz_firma.csv").read())
          EOF
          rm -rf data/ham/epdk
          curl -s -m 20 -o /dev/null -w "İBB trafik servisi: HTTP %{http_code}\n" https://api.ibb.gov.tr/tkmservices/api/TrafficData/v1/TrafficIndexHistory/1/H || echo "İBB trafik servisine erişilemedi"

      - name: Yeni yılın TÜİK sepeti
        if: inputs.mod != 'erisim_testi'
        run: |
          YIL=$(date +%Y)
          [ -f "data/referans/sepet_$YIL.csv" ] || webtufe sepet --yil "$YIL" || echo "$YIL sepeti henüz yayımlanmamış; önceki yılınki kullanılacak."

      - name: Fiyatları topla
        id: topla
        if: inputs.mod != 'erisim_testi'
        continue-on-error: true
        run: webtufe topla

      # EPDK akaryakıt ve LPG fiyatları: 81 il (~15 dk); 8 firma ülke ortalamasının eksik günleri
      # 2023 başından doldurulur (ilk çalışmada ~40 dk). Endekse girmez, yalnızca kaydedilir.
      - name: Akaryakıt fiyatları (EPDK)
        id: akaryakit
        if: inputs.mod != 'erisim_testi'
        continue-on-error: true
        timeout-minutes: 100
        run: webtufe akaryakit

      # İstanbul trafik indeksi (webtufe mobilite) burada toplanmaz: api.ibb.gov.tr GitHub
      # sunucularından erişilemiyor (24.11.2026 erişim testinde bağlantı zaman aşımı). Mac'teki
      # günlük görevde toplanıp scripts/trafik_gonder.sh ile ayrı commit'lerle gönderilir; bu iş
      # data/ham/ibb_trafik ve data/cikti/mobilite klasörlerine dokunmaz.

      - name: Endeksi hesapla
        if: inputs.mod != 'erisim_testi'
        run: webtufe hesapla

      - name: Manşetler
        if: inputs.mod != 'erisim_testi'
        continue-on-error: true
        run: webtufe mansetler

      # Endeks hesabı hata verse bile toplanan ham fiyatlar kaydedilir
      - name: Kaydet
        if: ${{ !cancelled() && inputs.mod != 'erisim_testi' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ham data/cikti data/referans
          if git diff --cached --quiet; then echo "Kaydedilecek değişiklik yok."; exit 0; fi
          git commit -m "Veri: $(date +%F)"
          git pull --rebase
          git push

      - name: Toplama hatasını bildir
        if: steps.topla.outcome == 'failure' || steps.akaryakit.outcome == 'failure'
        run: |
          if [ "${{ steps.topla.outcome }}" = "failure" ]; then
            echo "::error::Market fiyatı toplama tamamlanamadı (bazı şehirler eksik olabilir). Ayrıntı 'Fiyatları topla' adımında."
          fi
          if [ "${{ steps.akaryakit.outcome }}" = "failure" ]; then
            echo "::error::Akaryakıt fiyatı toplama tamamlanamadı (bazı iller eksik olabilir). Ayrıntı 'Akaryakıt fiyatları (EPDK)' adımında."
          fi
          exit 1
